name: Build Android app

on:
  push:
    paths: ["android/**", "web/**", ".github/workflows/android.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # to publish the .apk as a release
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Test NFC tag emulation
        run: ./gradlew -p nfc-core test

      # The app's permanent signing key. Created once, then reused, so updates install over the
      # old version. Needs the TAPCARD_KEY_PASSWORD repository secret; without it the build uses a
      # temporary key that changes every time.
      - name: Prepare signing key
        if: github.ref == 'refs/heads/main'
        env:
          TAPCARD_KEY_PASSWORD: ${{ secrets.TAPCARD_KEY_PASSWORD }}
        run: |
          if [ -z "$TAPCARD_KEY_PASSWORD" ]; then
            echo "::warning::No TAPCARD_KEY_PASSWORD secret: signing with a temporary key"
            exit 0
          fi
          if [ ! -f tapcard-release.keystore ]; then
            keytool -genkeypair -keystore tapcard-release.keystore -storetype PKCS12 \
              -alias tapcard -keyalg RSA -keysize 3072 -validity 10000 \
              -storepass "$TAPCARD_KEY_PASSWORD" -keypass "$TAPCARD_KEY_PASSWORD" -dname "CN=Tap Card"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add tapcard-release.keystore
            git commit -m "Add the app's signing key (its password is a repository secret) [skip ci]"
            git push
          fi

      - name: Build the app
        env:
          TAPCARD_KEY_PASSWORD: ${{ secrets.TAPCARD_KEY_PASSWORD }}
        run: ./gradlew assembleDebug

      - name: Upload the .apk
        uses: actions/upload-artifact@v4
        with:
          name: tapcard-android
          path: android/app/build/outputs/apk/debug/app-debug.apk

      # A direct phone download link that always points at the newest build:
      # https://github.com/<owner>/<repo>/releases/latest/download/tapcard.apk
      - name: Publish download link
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk tapcard.apk
          gh release create "build-${{ github.run_number }}" tapcard.apk \
            --title "Tap Card for Android (build ${{ github.run_number }})" \
            --notes "Download tapcard.apk on your Android phone and open it to install. Android will ask you to allow installs from your browser once." \
            --latest
