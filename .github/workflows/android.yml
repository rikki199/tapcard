name: Build Android app

on:
  push:
    paths: ["android/**", "web/**", ".github/workflows/android.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # to publish the .apk as a release
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Test NFC tag emulation
        run: ./gradlew -p nfc-core test

      - name: Build the app
        run: ./gradlew assembleDebug

      - name: Upload the .apk
        uses: actions/upload-artifact@v4
        with:
          name: tapcard-android
          path: android/app/build/outputs/apk/debug/app-debug.apk

      # A direct phone download link that always points at the newest build:
      # https://github.com/<owner>/<repo>/releases/latest/download/tapcard.apk
      - name: Publish download link
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk tapcard.apk
          gh release create "build-${{ github.run_number }}" tapcard.apk \
            --title "Tap Card for Android (build ${{ github.run_number }})" \
            --notes "Download tapcard.apk on your Android phone and open it to install. Android will ask you to allow installs from your browser once." \
            --latest
